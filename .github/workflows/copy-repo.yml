name: "Opret kopi af repository"

on:
  workflow_dispatch:
    inputs:
      student_id:
        description: "Dit navn, studienummer eller initialer (f.eks. hanne-m)"
        required: true
        type: string

jobs:
  duplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git Author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      # Trin 1: Beregn navne på repositories
      - name: Calculate Repository Names
        id: vars
        run: |
          TEMPLATE_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          TARGET_NAME="${TEMPLATE_NAME}-${{ inputs.student_id }}"
          
          echo "target_name=${TARGET_NAME}" >> $GITHUB_OUTPUT
          echo "template_name=${TEMPLATE_NAME}" >> $GITHUB_OUTPUT
      # Trin 2: Opret det tomme repository i organisationen
      - name: Create Empty Repo in Org
        env:
          GH_TOKEN: ${{ secrets.ORG_REPOSITORIES_TOKEN }}
        run: |
          if gh repo view "${{ github.repository_owner }}/${{ steps.vars.outputs.target_name }}" >/dev/null 2>&1; then
            echo "⚠️ Repositoriet findes allerede. Springer oprettelse over..."
          else
            echo "Opretter nyt repository..."
            echo "y" | gh repo create "${{ github.repository_owner }}/${{ steps.vars.outputs.target_name }}" --public
            gh repo edit "${{ github.repository_owner }}/${{ steps.vars.outputs.target_name }}" --enable-issues=true
          fi
      # Trin 3: Kopier kildekoden over (MED DOLLARTEGN OG SKRÅSTREGER)
      - name: Copy Git Code History Without Workflows
        env:
          GH_TOKEN: ${{ secrets.ORG_REPOSITORIES_TOKEN }}
        run: |
          git clone "https://github.com/${{ github.repository }}.git" workspace
          cd workspace
          if [ -d ".github/workflows" ]; then
            echo "Fjerner workflow-filer før upload..."
            rm -rf .github/workflows
            git add .github/workflows || true
            git commit -m "chore: remove assignment generation workflows for students" || true
          fi
          
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/${{ steps.vars.outputs.target_name }}.git" HEAD:main --force
      # Trin 4: Kopier alle Issues over
      - name: Copy Open Issues
        env:
          GH_TOKEN: ${{ secrets.ORG_REPOSITORIES_TOKEN }}
        run: |
          gh issue list -R "${{ github.repository }}" --json title,body --limit 100 | jq -c '.[]' | while read -r issue; do
            TITLE=$(echo "$issue" | jq -r '.title')
            BODY=$(echo "$issue" | jq -r '.body')
            gh issue create -R "${{ github.repository_owner }}/${{ steps.vars.outputs.target_name }}" -t "$TITLE" -b "$BODY"
          done
      # Trin 5: Giv den studerende skriveadgang (Write Permission) til deres nye repository
      - name: Add Student as Collaborator
        env:
          GH_TOKEN: ${{ secrets.ORG_REPOSITORIES_TOKEN }}
        run: |
          echo "Tilføjer ${{ github.actor }} som collaborator..."
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository_owner }}/${{ steps.vars.outputs.target_name }}/collaborators/${{ github.actor }} \
            -f permission=push
          
          echo "🚀 Færdig! Dit opgave-repository er klar her: https://github.com{{ github.repository_owner }}/${{ steps.vars.outputs.target_name }}"
